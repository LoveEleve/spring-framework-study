# Spring Debug 应用配置文件

# 应用基本信息
app.name=Spring Annotations Debug
app.version=5.3.39
app.description=Spring Framework 注解调试项目
app.debug=true

# 数据库配置
spring.datasource.url=jdbc:h2:mem:debugdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 日志配置
logging.level.org.springframework=DEBUG
logging.level.org.springframework.beans=TRACE
logging.level.org.springframework.context=DEBUG
logging.level.org.springframework.aop=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.web=DEBUG

# 自定义属性
custom.email.enabled=true
custom.email.host=smtp.example.com
custom.email.port=587
custom.email.username=debug@example.com
custom.email.password=password

# 缓存配置
cache.default.ttl=3600
cache.user.ttl=1800
cache.product.ttl=7200

# 异步配置
async.core-pool-size=5
async.max-pool-size=10
async.queue-capacity=100
async.thread-name-prefix=async-debug-

# 调度配置
scheduling.pool-size=3

# 性能监控
performance.monitoring.enabled=true
performance.slow.threshold=1000

# 验证配置
validation.fail-fast=false

# Web 配置
server.port=8080
server.servlet.context-path=/debug

# 跨域配置
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true